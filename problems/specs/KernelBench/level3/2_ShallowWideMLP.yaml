inputs:
  X:
    shape: [BATCH, IN_SIZE]
    dtype: inherit

inits:
  - dim: IN_SIZE
  - dim: LAYER_SIZES
  - dim: OUT_SIZE

ci:
  - params: [X]
    dtype: float32
    dims:
      BATCH: 4
      IN_SIZE: 32
      LAYER_SIZES: [32, 32]
      OUT_SIZE: 16
    flop: "2*BATCH*adjacent_prod_sum(IN_SIZE, LAYER_SIZES, OUT_SIZE)"

mlir-gpu-bench:
  - params: [X]
    dtype: bfloat16
    dims:
      BATCH: 128
      IN_SIZE: 16384
      LAYER_SIZES: [32768, 32768]
      OUT_SIZE: 16384
    flop: "2*BATCH*adjacent_prod_sum(IN_SIZE, LAYER_SIZES, OUT_SIZE)"

bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 128
      IN_SIZE: 2048
      LAYER_SIZES: [4096, 4096]
      OUT_SIZE: 2048
    flop: "2*BATCH*adjacent_prod_sum(IN_SIZE, LAYER_SIZES, OUT_SIZE)"
    rtol: 4.9e-04
    atol: 1.9e-04
