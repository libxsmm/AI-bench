# KernelBench YAML config for 48_Conv3d_Scaling_Tanh_Multiply_Sigmoid
inputs:
  X:
    shape: [BATCH, IN_CHANNELS, DEPTH, HEIGHT, WIDTH]
    dtype: inherit
inits:
  - dim: IN_CHANNELS
  - dim: OUT_CHANNELS
  - dim: KERNEL_SIZE
  - dim: SCALING_FACTOR
  - dim: BIAS_SHAPE
ci:
  - params: [X]
    dtype: float32
    dims:
      BATCH: 2
      IN_CHANNELS: 3
      OUT_CHANNELS: 16
      DEPTH: 16
      HEIGHT: 64
      WIDTH: 64
      KERNEL_SIZE: 3
      SCALING_FACTOR: 2
      BIAS_SHAPE: [16, 1, 1, 1]
      BATCH_SIZE: 2
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 128
      IN_CHANNELS: 3
      OUT_CHANNELS: 16
      DEPTH: 16
      HEIGHT: 64
      WIDTH: 64
      KERNEL_SIZE: 3
      SCALING_FACTOR: 2
      BIAS_SHAPE: [16, 1, 1, 1]
      BATCH_SIZE: 128
    flop: "2*BATCH*IN_CHANNELS*OUT_CHANNELS*KERNEL_SIZE**3*(DEPTH-KERNEL_SIZE+1)*(HEIGHT-KERNEL_SIZE+1)*(WIDTH-KERNEL_SIZE+1)"
