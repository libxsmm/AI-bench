# KernelBench YAML config for 49_ConvTranspose3d_Softmax_Sigmoid
inputs:
  X:
    shape: [BATCH, IN_CHANNELS, DEPTH, HEIGHT, WIDTH]
    dtype: inherit
inits:
  - dim: IN_CHANNELS
  - dim: OUT_CHANNELS
  - dim: KERNEL_SIZE
  - dim: STRIDE
  - dim: PADDING
  - dim: OUTPUT_PADDING
ci:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 16
      IN_CHANNELS: 32
      OUT_CHANNELS: 64
      DEPTH: 16
      HEIGHT: 16
      WIDTH: 16
      KERNEL_SIZE: 3
      STRIDE: 2
      PADDING: 1
      OUTPUT_PADDING: 1
      BIAS: true
      BATCH_SIZE: 16
      D: 16
      H: 32
      W: 32
    flop: "2*BATCH*IN_CHANNELS*OUT_CHANNELS*KERNEL_SIZE**3*DEPTH*HEIGHT*WIDTH"
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 16
      IN_CHANNELS: 32
      OUT_CHANNELS: 64
      DEPTH: 16
      HEIGHT: 16
      WIDTH: 16
      KERNEL_SIZE: 3
      STRIDE: 2
      PADDING: 1
      OUTPUT_PADDING: 1
      BIAS: true
      BATCH_SIZE: 16
      D: 16
      H: 32
      W: 32
    flop: "2*BATCH*IN_CHANNELS*OUT_CHANNELS*KERNEL_SIZE**3*DEPTH*HEIGHT*WIDTH"
