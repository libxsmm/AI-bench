# KernelBench YAML config for 33_Gemm_Scale_BatchNorm
inputs:
  X:
    shape: [BATCH, IN_FEAT]
    dtype: inherit
inits:
  - dim: IN_FEAT
  - dim: OUT_FEAT
  - dim: SCALE_SHAPE
ci:
  - params: [X]
    dtype: float32
    dims:
      BATCH: 2
      IN_FEAT: 32
      OUT_FEAT: 32
      SCALE_SHAPE: [32]
      EPS: 1.0e-05
      MOMENTUM: 0.1
      BATCH_SIZE: 16
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 1024
      IN_FEAT: 8192
      OUT_FEAT: 8192
      SCALE_SHAPE: [8192]
      EPS: 1.0e-05
      MOMENTUM: 0.1
      BATCH_SIZE: 1024
    flop: "2*BATCH*IN_FEAT*OUT_FEAT"
