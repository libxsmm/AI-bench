# KernelBench YAML config for 52_Conv2d_Activation_BatchNorm
inputs:
  X:
    shape: [BATCH, IN_CHANNELS, HEIGHT, WIDTH]
    dtype: inherit
inits:
  - dim: IN_CHANNELS
  - dim: OUT_CHANNELS
  - dim: KERNEL_SIZE
ci:
  - params: [X]
    dtype: float32
    dims:
      BATCH: 64
      IN_CHANNELS: 8
      OUT_CHANNELS: 16
      HEIGHT: 16
      WIDTH: 16
      KERNEL_SIZE: 3
      EPS: 1.0e-05
      MOMENTUM: 0.1
      BATCH_SIZE: 64
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 64
      IN_CHANNELS: 64
      OUT_CHANNELS: 128
      HEIGHT: 128
      WIDTH: 128
      KERNEL_SIZE: 3
      EPS: 1.0e-05
      MOMENTUM: 0.1
      BATCH_SIZE: 64
    flop: "2*BATCH*IN_CHANNELS*OUT_CHANNELS*KERNEL_SIZE*KERNEL_SIZE*(HEIGHT-KERNEL_SIZE+1)*(WIDTH-KERNEL_SIZE+1)"
