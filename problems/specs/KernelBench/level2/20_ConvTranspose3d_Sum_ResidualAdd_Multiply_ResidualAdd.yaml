# KernelBench YAML config for 20_ConvTranspose3d_Sum_ResidualAdd_Multiply_ResidualAdd
inputs:
  X:
    shape: [BATCH, IN_CHANNELS, DEPTH, HEIGHT, WIDTH]
    dtype: inherit
inits:
  - dim: IN_CHANNELS
  - dim: OUT_CHANNELS
  - dim: KERNEL_SIZE
  - dim: STRIDE
  - dim: PADDING
  - dim: OUTPUT_PADDING
  - dim: BIAS_SHAPE
ci:
  - params: [X]
    dtype: float32
    dims:
      BATCH: 16
      IN_CHANNELS: 32
      OUT_CHANNELS: 64
      DEPTH: 16
      HEIGHT: 32
      WIDTH: 32
      KERNEL_SIZE: 3
      STRIDE: 2
      PADDING: 1
      OUTPUT_PADDING: 1
      BIAS_SHAPE: [64, 1, 1, 1]
      BATCH_SIZE: 16
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 16
      IN_CHANNELS: 32
      OUT_CHANNELS: 64
      DEPTH: 16
      HEIGHT: 32
      WIDTH: 32
      KERNEL_SIZE: 3
      STRIDE: 2
      PADDING: 1
      OUTPUT_PADDING: 1
      BIAS_SHAPE: [64, 1, 1, 1]
      BATCH_SIZE: 16
    flop: "2*BATCH*IN_CHANNELS*OUT_CHANNELS*KERNEL_SIZE**3*DEPTH*HEIGHT*WIDTH"
