# KernelBench YAML config for 61_ConvTranspose3d_ReLU_GroupNorm
inputs:
  X:
    shape: [BATCH, IN_CHANNELS, DEPTH, HEIGHT, WIDTH]
    dtype: inherit
inits:
  - dim: IN_CHANNELS
  - dim: OUT_CHANNELS
  - dim: KERNEL_SIZE
  - dim: GROUPS
  - dim: BIAS
ci:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 16
      IN_CHANNELS: 8
      OUT_CHANNELS: 16
      KERNEL_SIZE: 3
      DEPTH: 16
      HEIGHT: 16
      WIDTH: 16
      NUM_GROUPS: 4
      GROUPS: 4
      BIAS: false
      BATCH_SIZE: 16
      D: 32
      H: 32
      W: 32
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 16
      IN_CHANNELS: 64
      OUT_CHANNELS: 128
      KERNEL_SIZE: 3
      DEPTH: 16
      HEIGHT: 16
      WIDTH: 16
      NUM_GROUPS: 16
      GROUPS: 8
      BIAS: false
      BATCH_SIZE: 16
      D: 32
      H: 32
      W: 32
    flop: "2*BATCH*IN_CHANNELS*OUT_CHANNELS*KERNEL_SIZE**3*DEPTH*HEIGHT*WIDTH"
