# KernelBench YAML config for 68_Matmul_Min_Subtract
inputs:
  X:
    shape: [BATCH, IN_FEAT]
    dtype: inherit
inits:
  - dim: IN_FEAT
  - dim: OUT_FEAT
  - dim: CONSTANT
ci:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 2
      IN_FEAT: 256
      OUT_FEAT: 256
      CONSTANT: 2.0
      BATCH_SIZE: 2
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 128
      IN_FEAT: 16384
      OUT_FEAT: 16384
      CONSTANT: 2.0
      BATCH_SIZE: 128
    flop: "2*BATCH*IN_FEAT*OUT_FEAT"
