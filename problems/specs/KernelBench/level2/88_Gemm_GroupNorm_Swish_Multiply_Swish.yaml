# KernelBench YAML config for 88_Gemm_GroupNorm_Swish_Multiply_Swish
inputs:
  X:
    shape: [BATCH, IN_FEAT]
    dtype: inherit
inits:
  - dim: IN_FEAT
  - dim: OUT_FEAT
  - dim: NUM_GROUPS
  - dim: MULTIPLY_WEIGHT_SHAPE
ci:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 16
      IN_FEAT: 256
      OUT_FEAT: 256
      NUM_GROUPS: 16
      MULTIPLY_WEIGHT_SHAPE: [256]
      BATCH_SIZE: 16
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 256
      IN_FEAT: 8192
      OUT_FEAT: 8192
      NUM_GROUPS: 256
      MULTIPLY_WEIGHT_SHAPE: [8192]
      BATCH_SIZE: 256
    flop: "2*BATCH*IN_FEAT*OUT_FEAT"
