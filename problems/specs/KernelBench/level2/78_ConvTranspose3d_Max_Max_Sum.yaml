# KernelBench YAML config for 78_ConvTranspose3d_Max_Max_Sum
inputs:
  X:
    shape: [BATCH, IN_CHANNELS, DEPTH, HEIGHT, WIDTH]
    dtype: inherit
inits:
  - dim: IN_CHANNELS
  - dim: OUT_CHANNELS
  - dim: KERNEL_SIZE
  - dim: STRIDE
  - dim: PADDING
ci:
  - params: [X]
    dtype: float32
    dims:
      BATCH: 16
      IN_CHANNELS: 32
      OUT_CHANNELS: 64
      DEPTH: 32
      HEIGHT: 32
      WIDTH: 32
      KERNEL_SIZE: 5
      STRIDE: 2
      PADDING: 2
      BATCH_SIZE: 16
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 16
      IN_CHANNELS: 32
      OUT_CHANNELS: 64
      DEPTH: 32
      HEIGHT: 32
      WIDTH: 32
      KERNEL_SIZE: 5
      STRIDE: 2
      PADDING: 2
      BATCH_SIZE: 16
    flop: "2*BATCH*IN_CHANNELS*OUT_CHANNELS*KERNEL_SIZE**3*DEPTH*HEIGHT*WIDTH"
