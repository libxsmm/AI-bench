# KernelBench YAML config for 51_Gemm_Subtract_GlobalAvgPool_LogSumExp_GELU_ResidualAdd
inputs:
  X:
    shape: [BATCH, IN_FEAT]
    dtype: inherit
inits:
  - dim: IN_FEAT
  - dim: OUT_FEAT
ci:
  - params: [X]
    dtype: float32
    dims:
      BATCH: 32
      IN_FEAT: 128
      OUT_FEAT: 128
      BIAS: true
      BATCH_SIZE: 32
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 2048
      IN_FEAT: 8192
      OUT_FEAT: 8192
      BIAS: true
      BATCH_SIZE: 2048
    flop: "2*BATCH*IN_FEAT*OUT_FEAT"
