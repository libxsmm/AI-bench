# KernelBench YAML config for 47_Conv3d_Mish_Tanh
inputs:
  X:
    shape: [BATCH, IN_CHANNELS, DEPTH, HEIGHT, WIDTH]
    dtype: inherit
inits:
  - dim: IN_CHANNELS
  - dim: OUT_CHANNELS
  - dim: KERNEL_SIZE
ci:
  - params: [X]
    dtype: float32
    dims:
      BATCH: 16
      IN_CHANNELS: 32
      OUT_CHANNELS: 64
      KERNEL_SIZE: 3
      DEPTH: 16
      HEIGHT: 16
      WIDTH: 16
      STRIDE: 1
      PADDING: 0
      BATCH_SIZE: 16
      D: 32
      H: 64
      W: 64
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 16
      IN_CHANNELS: 32
      OUT_CHANNELS: 64
      KERNEL_SIZE: 3
      DEPTH: 16
      HEIGHT: 16
      WIDTH: 16
      STRIDE: 1
      PADDING: 0
      BATCH_SIZE: 16
      D: 32
      H: 64
      W: 64
    flop: "2*BATCH*IN_CHANNELS*OUT_CHANNELS*KERNEL_SIZE**3*(DEPTH-KERNEL_SIZE+1)*(HEIGHT-KERNEL_SIZE+1)*(WIDTH-KERNEL_SIZE+1)"
