# KernelBench YAML config for 31_Conv2d_Min_Add_Multiply
inputs:
  X:
    shape: [BATCH, IN_CHANNELS, HEIGHT, WIDTH]
    dtype: inherit
inits:
  - dim: IN_CHANNELS
  - dim: OUT_CHANNELS
  - dim: KERNEL_SIZE
  - dim: CONSTANT_VALUE
  - dim: BIAS_SHAPE
  - dim: SCALING_FACTOR
ci:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 2
      IN_CHANNELS: 8
      OUT_CHANNELS: 16
      HEIGHT: 16
      WIDTH: 16
      KERNEL_SIZE: 3
      CONSTANT_VALUE: 0.5
      BIAS_SHAPE: [16, 1, 1]
      SCALING_FACTOR: 2.0
      BATCH_SIZE: 2
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 128
      IN_CHANNELS: 64
      OUT_CHANNELS: 128
      HEIGHT: 128
      WIDTH: 128
      KERNEL_SIZE: 3
      CONSTANT_VALUE: 0.5
      BIAS_SHAPE: [128, 1, 1]
      SCALING_FACTOR: 2.0
      BATCH_SIZE: 128
    flop: "2*BATCH*IN_CHANNELS*OUT_CHANNELS*KERNEL_SIZE*KERNEL_SIZE*(HEIGHT-KERNEL_SIZE+1)*(WIDTH-KERNEL_SIZE+1)"
