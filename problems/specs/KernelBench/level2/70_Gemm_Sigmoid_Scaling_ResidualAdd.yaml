# KernelBench YAML config for 70_Gemm_Sigmoid_Scaling_ResidualAdd
inputs:
  X:
    shape: [BATCH, IN_FEAT]
    dtype: inherit
inits:
  - dim: INPUT_SIZE
  - dim: HIDDEN_SIZE
  - dim: SCALING_FACTOR
ci:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 16
      IN_FEAT: 128
      OUT_FEAT: 64
      SCALING_FACTOR: 2.0
      BATCH_SIZE: 16
      INPUT_SIZE: 128
      HIDDEN_SIZE: 128
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 1024
      IN_FEAT: 8192
      OUT_FEAT: 4096
      SCALING_FACTOR: 2.0
      BATCH_SIZE: 1024
      INPUT_SIZE: 8192
      HIDDEN_SIZE: 8192
    flop: "2*BATCH*INPUT_SIZE*HIDDEN_SIZE"
