# KernelBench YAML config for 45_Gemm_Sigmoid_LogSumExp
inputs:
  X:
    shape: [BATCH, INPUT_SIZE]
    dtype: float16
inits:
  - dim: INPUT_SIZE
  - dim: HIDDEN_SIZE
  - dim: OUTPUT_SIZE
ci:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 256
      INPUT_SIZE: 32
      HIDDEN_SIZE: 64
      OUTPUT_SIZE: 16
      BATCH_SIZE: 256
    flop: "2*BATCH*INPUT_SIZE*HIDDEN_SIZE + 2*BATCH*HIDDEN_SIZE*OUTPUT_SIZE"
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 16384
      INPUT_SIZE: 2048
      HIDDEN_SIZE: 4096
      OUTPUT_SIZE: 1024
      BATCH_SIZE: 16384
    flop: "2*BATCH*INPUT_SIZE*HIDDEN_SIZE + 2*BATCH*HIDDEN_SIZE*OUTPUT_SIZE"
