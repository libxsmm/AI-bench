# KernelBench YAML config for 2_ConvTranspose2d_BiasAdd_Clamp_Scaling_Clamp_Divide
inputs:
  X:
    shape: [BATCH, IN_CHANNELS, HEIGHT, WIDTH]
    dtype: float16
inits:
  - dim: IN_CHANNELS
  - dim: OUT_CHANNELS
  - dim: KERNEL_SIZE
  - dim: STRIDE
  - dim: PADDING
  - dim: OUTPUT_PADDING
  - dim: BIAS_SHAPE
  - dim: SCALING_FACTOR
ci:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 2
      IN_CHANNELS: 64
      OUT_CHANNELS: 64
      KERNEL_SIZE: 3
      HEIGHT: 2
      WIDTH: 2
      STRIDE: 2
      PADDING: 1
      OUTPUT_PADDING: 1
      BIAS_SHAPE: [64, 1, 1]
      SCALING_FACTOR: 2.0
      BATCH_SIZE: 2
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 128
      IN_CHANNELS: 64
      OUT_CHANNELS: 64
      KERNEL_SIZE: 3
      HEIGHT: 128
      WIDTH: 128
      STRIDE: 2
      PADDING: 1
      OUTPUT_PADDING: 1
      BIAS_SHAPE: [64, 1, 1]
      SCALING_FACTOR: 2.0
      BATCH_SIZE: 128
    flop: "2*BATCH*IN_CHANNELS*OUT_CHANNELS*KERNEL_SIZE*KERNEL_SIZE*HEIGHT*WIDTH"
