# KernelBench YAML config for 19_ConvTranspose2d_GELU_GroupNorm
inputs:
  X:
    shape: [BATCH, IN_CHANNELS, HEIGHT, WIDTH]
    dtype: inherit
inits:
  - dim: IN_CHANNELS
  - dim: OUT_CHANNELS
  - dim: KERNEL_SIZE
  - dim: STRIDE
  - dim: GROUPS
  - dim: NUM_GROUPS
ci:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 2
      IN_CHANNELS: 64
      OUT_CHANNELS: 64
      KERNEL_SIZE: 3
      STRIDE: 1
      GROUPS: 8
      NUM_GROUPS: 8
      HEIGHT: 4
      WIDTH: 4
      BATCH_SIZE: 2
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 128
      IN_CHANNELS: 64
      OUT_CHANNELS: 64
      KERNEL_SIZE: 3
      STRIDE: 1
      GROUPS: 8
      NUM_GROUPS: 8
      HEIGHT: 128
      WIDTH: 128
      BATCH_SIZE: 128
    flop: "2*BATCH*IN_CHANNELS*OUT_CHANNELS*KERNEL_SIZE*KERNEL_SIZE*HEIGHT*WIDTH"
