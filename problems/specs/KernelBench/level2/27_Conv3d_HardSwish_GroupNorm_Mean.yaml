# KernelBench YAML config for 27_Conv3d_HardSwish_GroupNorm_Mean
inputs:
  X:
    shape: [BATCH, IN_CHANNELS, DEPTH, HEIGHT, WIDTH]
    dtype: inherit
inits:
  - dim: IN_CHANNELS
  - dim: OUT_CHANNELS
  - dim: KERNEL_SIZE
ci:
  - params: [X]
    dtype: float32
    dims:
      BATCH: 16
      IN_CHANNELS: 3
      OUT_CHANNELS: 16
      DEPTH: 16
      HEIGHT: 32
      WIDTH: 32
      KERNEL_SIZE: 4
      NUM_GROUPS: 4
      BIAS: true
      BATCH_SIZE: 16
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 1024
      IN_CHANNELS: 3
      OUT_CHANNELS: 16
      DEPTH: 16
      HEIGHT: 32
      WIDTH: 32
      KERNEL_SIZE: 4
      NUM_GROUPS: 4
      BIAS: true
      BATCH_SIZE: 1024
    flop: "2*BATCH*IN_CHANNELS*OUT_CHANNELS*KERNEL_SIZE**3*(DEPTH-KERNEL_SIZE+1)*(HEIGHT-KERNEL_SIZE+1)*(WIDTH-KERNEL_SIZE+1)"
