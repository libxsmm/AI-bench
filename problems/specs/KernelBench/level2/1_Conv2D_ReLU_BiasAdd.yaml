# KernelBench YAML config for 1_Conv2D_ReLU_BiasAdd
inputs:
  X:
    shape: [BATCH, IN_CHANNELS, HEIGHT, WIDTH]
    dtype: inherit
inits:
  - dim: IN_CHANNELS
  - dim: OUT_CHANNELS
  - dim: KERNEL_SIZE
  - dim: BIAS_SHAPE
ci:
  - params: [X]
    dtype: float32
    dims:
      BATCH: 2
      IN_CHANNELS: 8
      OUT_CHANNELS: 16
      HEIGHT: 16
      WIDTH: 16
      KERNEL_SIZE: 3
      BIAS_SHAPE: [16, 1, 1]
      BATCH_SIZE: 2
bench-gpu:
  - params: [X]
    dtype: float16
    memory_format: channels_last
    dims:
      BATCH: 128
      IN_CHANNELS: 64
      OUT_CHANNELS: 128
      HEIGHT: 128
      WIDTH: 128
      KERNEL_SIZE: 3
      BIAS_SHAPE: [128, 1, 1]
      BATCH_SIZE: 128
    flop: "2*BATCH*OUT_CHANNELS*(HEIGHT-KERNEL_SIZE+1)*(WIDTH-KERNEL_SIZE+1)*IN_CHANNELS*KERNEL_SIZE*KERNEL_SIZE"
