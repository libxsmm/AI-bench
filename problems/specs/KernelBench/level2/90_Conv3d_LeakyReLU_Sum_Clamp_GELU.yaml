# KernelBench YAML config for 90_Conv3d_LeakyReLU_Sum_Clamp_GELU
inputs:
  X:
    shape: [BATCH, IN_CHANNELS, DEPTH, HEIGHT, WIDTH]
    dtype: inherit
inits:
  - dim: IN_CHANNELS
  - dim: OUT_CHANNELS
  - dim: KERNEL_SIZE
  - dim: SUM_TENSOR_SHAPE
ci:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 2
      IN_CHANNELS: 8
      OUT_CHANNELS: 64
      DEPTH: 16
      HEIGHT: 64
      WIDTH: 64
      KERNEL_SIZE: 3
      SUM_TENSOR_SHAPE: [64, 1, 1, 1]
      BATCH_SIZE: 2
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 128
      IN_CHANNELS: 8
      OUT_CHANNELS: 64
      DEPTH: 16
      HEIGHT: 64
      WIDTH: 64
      KERNEL_SIZE: 3
      SUM_TENSOR_SHAPE: [64, 1, 1, 1]
      BATCH_SIZE: 128
    flop: "2*BATCH*IN_CHANNELS*OUT_CHANNELS*KERNEL_SIZE**3*(DEPTH-KERNEL_SIZE+1)*(HEIGHT-KERNEL_SIZE+1)*(WIDTH-KERNEL_SIZE+1)"
