# KernelBench YAML config for 24_Conv3d_Min_Softmax
inputs:
  X:
    shape: [BATCH, IN_CHANNELS, DEPTH, HEIGHT, WIDTH]
    dtype: inherit
inits:
  - dim: IN_CHANNELS
  - dim: OUT_CHANNELS
  - dim: KERNEL_SIZE
  - dim: DIM
ci:
  - params: [X]
    dtype: float32
    dims:
      BATCH: 2
      IN_CHANNELS: 3
      OUT_CHANNELS: 24
      DEPTH: 16
      HEIGHT: 16
      WIDTH: 16
      KERNEL_SIZE: 3
      DIM: 2
      BATCH_SIZE: 2
      D: 24
      H: 32
      W: 32
    flop: "2*BATCH*IN_CHANNELS*OUT_CHANNELS*KERNEL_SIZE**3*(DEPTH-KERNEL_SIZE+1)*(HEIGHT-KERNEL_SIZE+1)*(WIDTH-KERNEL_SIZE+1)"
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 128
      IN_CHANNELS: 3
      OUT_CHANNELS: 24
      DEPTH: 16
      HEIGHT: 16
      WIDTH: 16
      KERNEL_SIZE: 3
      DIM: 2
      BATCH_SIZE: 128
      D: 24
      H: 32
      W: 32
    flop: "2*BATCH*IN_CHANNELS*OUT_CHANNELS*KERNEL_SIZE**3*(DEPTH-KERNEL_SIZE+1)*(HEIGHT-KERNEL_SIZE+1)*(WIDTH-KERNEL_SIZE+1)"
