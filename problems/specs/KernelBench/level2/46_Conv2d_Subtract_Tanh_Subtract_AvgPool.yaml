# KernelBench YAML config for 46_Conv2d_Subtract_Tanh_Subtract_AvgPool
inputs:
  X:
    shape: [BATCH, IN_CHANNELS, HEIGHT, WIDTH]
    dtype: inherit
inits:
  - dim: IN_CHANNELS
  - dim: OUT_CHANNELS
  - dim: KERNEL_SIZE
  - dim: SUBTRACT1_VALUE
  - dim: SUBTRACT2_VALUE
  - dim: KERNEL_SIZE_POOL
ci:
  - params: [X]
    dtype: float32
    dims:
      BATCH: 2
      IN_CHANNELS: 8
      OUT_CHANNELS: 16
      HEIGHT: 16
      WIDTH: 16
      KERNEL_SIZE: 3
      SUBTRACT1_VALUE: 0.5
      SUBTRACT2_VALUE: 0.2
      KERNEL_SIZE_POOL: 2
      BATCH_SIZE: 2
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 128
      IN_CHANNELS: 64
      OUT_CHANNELS: 128
      HEIGHT: 128
      WIDTH: 128
      KERNEL_SIZE: 3
      SUBTRACT1_VALUE: 0.5
      SUBTRACT2_VALUE: 0.2
      KERNEL_SIZE_POOL: 2
      BATCH_SIZE: 128
    flop: "2*BATCH*IN_CHANNELS*OUT_CHANNELS*KERNEL_SIZE*KERNEL_SIZE*(HEIGHT-KERNEL_SIZE+1)*(WIDTH-KERNEL_SIZE+1)"
