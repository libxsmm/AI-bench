# KernelBench YAML config for 66_Matmul_Dropout_Softmax
inputs:
  X:
    shape: [BATCH, IN_FEAT]
    dtype: inherit
inits:
  - dim: IN_FEAT
  - dim: OUT_FEAT
  - dim: DROPOUT_P
ci:
  - params: [X]
    dtype: float32
    dims:
      BATCH: 2
      IN_FEAT: 256
      OUT_FEAT: 256
      DROPOUT_P: 0.2
      BATCH_SIZE: 2
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 128
      IN_FEAT: 16384
      OUT_FEAT: 16384
      DROPOUT_P: 0.2
      BATCH_SIZE: 128
    flop: "2*BATCH*IN_FEAT*OUT_FEAT"
