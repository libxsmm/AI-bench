# KernelBench YAML config for 3_ConvTranspose3d_Sum_LayerNorm_AvgPool_GELU
inputs:
  X:
    shape: [BATCH, IN_CHANNELS, DEPTH, HEIGHT, WIDTH]
    dtype: inherit
inits:
  - dim: IN_CHANNELS
  - dim: OUT_CHANNELS
  - dim: KERNEL_SIZE
  - dim: STRIDE
  - dim: PADDING
  - dim: OUTPUT_PADDING
  - dim: SUM_WEIGHT
  - dim: NORM_SHAPE
  - dim: POOL_KERNEL_SIZE
ci:
  - params: [X]
    dtype: float32
    dims:
      BATCH: 32
      IN_CHANNELS: 32
      OUT_CHANNELS: 64
      DEPTH: 16
      HEIGHT: 32
      WIDTH: 32
      KERNEL_SIZE: [3, 3, 3]
      STRIDE: [2, 2, 2]
      PADDING: [1, 1, 1]
      OUTPUT_PADDING: [1, 1, 1]
      SUM_WEIGHT: 1.0
      NORM_SHAPE: [64]
      POOL_KERNEL_SIZE: [2, 2, 2]
      BATCH_SIZE: 32
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 32
      IN_CHANNELS: 32
      OUT_CHANNELS: 64
      DEPTH: 16
      HEIGHT: 32
      WIDTH: 32
      KERNEL_SIZE: [3, 3, 3]
      STRIDE: [2, 2, 2]
      PADDING: [1, 1, 1]
      OUTPUT_PADDING: [1, 1, 1]
      SUM_WEIGHT: 1.0
      NORM_SHAPE: [64]
      POOL_KERNEL_SIZE: [2, 2, 2]
      BATCH_SIZE: 32
    flop: "2*BATCH*IN_CHANNELS*OUT_CHANNELS*27*DEPTH*HEIGHT*WIDTH"
