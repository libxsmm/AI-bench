# KernelBench YAML config for 4_Conv2d_Mish_Mish
inputs:
  X:
    shape: [BATCH, IN_CHANNELS, HEIGHT, WIDTH]
    dtype: float16
inits:
  - dim: IN_CHANNELS
  - dim: OUT_CHANNELS
  - dim: KERNEL_SIZE
ci:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 64
      IN_CHANNELS: 64
      OUT_CHANNELS: 2
      KERNEL_SIZE: 3
      HEIGHT: 4
      WIDTH: 4
      BATCH_SIZE: 64
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 64
      IN_CHANNELS: 64
      OUT_CHANNELS: 128
      KERNEL_SIZE: 3
      HEIGHT: 256
      WIDTH: 256
      BATCH_SIZE: 64
    flop: "2*BATCH*IN_CHANNELS*OUT_CHANNELS*KERNEL_SIZE*KERNEL_SIZE*(HEIGHT-KERNEL_SIZE+1)*(WIDTH-KERNEL_SIZE+1)"
