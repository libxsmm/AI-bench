# KernelBench YAML config for 75_Gemm_GroupNorm_Min_BiasAdd
inputs:
  X:
    shape: [BATCH, IN_FEAT]
    dtype: inherit
inits:
  - dim: IN_FEAT
  - dim: OUT_FEAT
  - dim: NUM_GROUPS
  - dim: BIAS_SHAPE
ci:
  - params: [X]
    dtype: float32
    dims:
      BATCH: 16
      IN_FEAT: 128
      OUT_FEAT: 128
      NUM_GROUPS: 8
      BIAS_SHAPE: [1, 128, 1, 1]
      BATCH_SIZE: 16
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 1024
      IN_FEAT: 8192
      OUT_FEAT: 8192
      NUM_GROUPS: 512
      BIAS_SHAPE: [1, 8192, 1, 1]
      BATCH_SIZE: 1024
    flop: "2*BATCH*IN_FEAT*OUT_FEAT"
