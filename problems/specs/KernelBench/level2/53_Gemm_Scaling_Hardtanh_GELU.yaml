# KernelBench YAML config for 53_Gemm_Scaling_Hardtanh_GELU
inputs:
  X:
    shape: [BATCH, IN_FEAT]
    dtype: inherit
inits:
  - dim: IN_FEAT
  - dim: OUT_FEAT
  - dim: SCALING_FACTOR
  - dim: HARDTANH_MIN
  - dim: HARDTANH_MAX
ci:
  - params: [X]
    dtype: float32
    dims:
      BATCH: 32
      IN_FEAT: 128
      OUT_FEAT: 128
      SCALING_FACTOR: 0.5
      HARDTANH_MIN: -2
      HARDTANH_MAX: 2
      BATCH_SIZE: 32
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 2048
      IN_FEAT: 8192
      OUT_FEAT: 8192
      SCALING_FACTOR: 0.5
      HARDTANH_MIN: -2
      HARDTANH_MAX: 2
      BATCH_SIZE: 2048
    flop: "2*BATCH*IN_FEAT*OUT_FEAT"
