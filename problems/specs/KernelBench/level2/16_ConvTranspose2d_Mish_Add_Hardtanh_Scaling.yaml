# KernelBench YAML config for 16_ConvTranspose2d_Mish_Add_Hardtanh_Scaling
inputs:
  X:
    shape: [BATCH, IN_CHANNELS, HEIGHT, WIDTH]
    dtype: inherit
inits:
  - dim: IN_CHANNELS
  - dim: OUT_CHANNELS
  - dim: KERNEL_SIZE
  - dim: STRIDE
  - dim: PADDING
  - dim: OUTPUT_PADDING
  - dim: ADD_VALUE
  - dim: SCALE
ci:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 2
      IN_CHANNELS: 64
      OUT_CHANNELS: 64
      KERNEL_SIZE: 3
      HEIGHT: 2
      WIDTH: 2
      STRIDE: 2
      PADDING: 1
      OUTPUT_PADDING: 1
      ADD_VALUE: 0.5
      SCALE: 2
      BATCH_SIZE: 2
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 128
      IN_CHANNELS: 64
      OUT_CHANNELS: 64
      KERNEL_SIZE: 3
      HEIGHT: 128
      WIDTH: 128
      STRIDE: 2
      PADDING: 1
      OUTPUT_PADDING: 1
      ADD_VALUE: 0.5
      SCALE: 2
      BATCH_SIZE: 128
    flop: "2*BATCH*IN_CHANNELS*OUT_CHANNELS*KERNEL_SIZE*KERNEL_SIZE*HEIGHT*WIDTH"
