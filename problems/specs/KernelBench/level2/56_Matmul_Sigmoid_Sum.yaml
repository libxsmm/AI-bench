inputs:
  X:
    shape: [BATCH_SIZE, INPUT_SIZE]
    dtype: inherit

inits:
  - dim: INPUT_SIZE
  - dim: HIDDEN_SIZE

ci:
  - params: [X]
    dtype: float32
    dims:
      BATCH_SIZE: 2
      INPUT_SIZE: 32
      HIDDEN_SIZE: 32

bench-cpu:
  - params: [X]
    dtype: bfloat16
    dims:
      BATCH_SIZE: 128
      INPUT_SIZE: 32768
      HIDDEN_SIZE: 32768
