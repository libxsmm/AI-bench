# KernelBench YAML config for 54_Conv2d_Multiply_LeakyReLU_GELU
inputs:
  X:
    shape: [BATCH, IN_CHANNELS, HEIGHT, WIDTH]
    dtype: inherit
inits:
  - dim: IN_CHANNELS
  - dim: OUT_CHANNELS
  - dim: KERNEL_SIZE
  - dim: MULTIPLIER_SHAPE
ci:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 64
      IN_CHANNELS: 8
      OUT_CHANNELS: 16
      HEIGHT: 16
      WIDTH: 16
      KERNEL_SIZE: 3
      MULTIPLIER_SHAPE: [16, 1, 1]
      BATCH_SIZE: 64
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 64
      IN_CHANNELS: 64
      OUT_CHANNELS: 64
      HEIGHT: 256
      WIDTH: 256
      KERNEL_SIZE: 3
      MULTIPLIER_SHAPE: [64, 1, 1]
      BATCH_SIZE: 64
    flop: "2*BATCH*IN_CHANNELS*OUT_CHANNELS*KERNEL_SIZE*KERNEL_SIZE*(HEIGHT-KERNEL_SIZE+1)*(WIDTH-KERNEL_SIZE+1)"
