# KernelBench YAML config for 41_Gemm_BatchNorm_GELU_ReLU
inputs:
  X:
    shape: [BATCH, IN_FEAT]
    dtype: inherit
inits:
  - dim: IN_FEAT
  - dim: OUT_FEAT
ci:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 256
      IN_FEAT: 64
      OUT_FEAT: 64
      BATCH_SIZE: 256
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 16384
      IN_FEAT: 4096
      OUT_FEAT: 4096
      BATCH_SIZE: 16384
    flop: "2*BATCH*IN_FEAT*OUT_FEAT"
