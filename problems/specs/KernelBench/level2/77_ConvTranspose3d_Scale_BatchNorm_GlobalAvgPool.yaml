# KernelBench YAML config for 77_ConvTranspose3d_Scale_BatchNorm_GlobalAvgPool
inputs:
  X:
    shape: [BATCH, IN_CHANNELS, DEPTH, HEIGHT, WIDTH]
    dtype: inherit
inits:
  - dim: IN_CHANNELS
  - dim: OUT_CHANNELS
  - dim: KERNEL_SIZE
  - dim: SCALE_FACTOR
ci:
  - params: [X]
    dtype: float32
    dims:
      BATCH: 16
      IN_CHANNELS: 64
      OUT_CHANNELS: 2
      DEPTH: 16
      HEIGHT: 32
      WIDTH: 32
      KERNEL_SIZE: 5
      SCALE_FACTOR: 2.0
      EPS: 1.0e-05
      MOMENTUM: 0.1
      BATCH_SIZE: 16
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 16
      IN_CHANNELS: 64
      OUT_CHANNELS: 128
      DEPTH: 16
      HEIGHT: 32
      WIDTH: 32
      KERNEL_SIZE: 5
      SCALE_FACTOR: 2.0
      EPS: 1.0e-05
      MOMENTUM: 0.1
      BATCH_SIZE: 16
    flop: "2*BATCH*IN_CHANNELS*OUT_CHANNELS*KERNEL_SIZE**3*DEPTH*HEIGHT*WIDTH"
