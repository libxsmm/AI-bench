# KernelBench YAML config for 87_Conv2d_Subtract_Subtract_Mish
inputs:
  X:
    shape: [BATCH, IN_CHANNELS, HEIGHT, WIDTH]
    dtype: inherit
inits:
  - dim: IN_CHANNELS
  - dim: OUT_CHANNELS
  - dim: KERNEL_SIZE
  - dim: SUBTRACT_VALUE_1
  - dim: SUBTRACT_VALUE_2
ci:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 2
      IN_CHANNELS: 8
      OUT_CHANNELS: 64
      HEIGHT: 4
      WIDTH: 4
      KERNEL_SIZE: 3
      SUBTRACT_VALUE_1: 0.5
      SUBTRACT_VALUE_2: 0.2
      BATCH_SIZE: 2
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 128
      IN_CHANNELS: 8
      OUT_CHANNELS: 64
      HEIGHT: 256
      WIDTH: 256
      KERNEL_SIZE: 3
      SUBTRACT_VALUE_1: 0.5
      SUBTRACT_VALUE_2: 0.2
      BATCH_SIZE: 128
    flop: "2*BATCH*IN_CHANNELS*OUT_CHANNELS*KERNEL_SIZE*KERNEL_SIZE*(HEIGHT-KERNEL_SIZE+1)*(WIDTH-KERNEL_SIZE+1)"
