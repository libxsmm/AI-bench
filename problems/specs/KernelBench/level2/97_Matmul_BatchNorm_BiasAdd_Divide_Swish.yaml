# KernelBench YAML config for 97_Matmul_BatchNorm_BiasAdd_Divide_Swish
inputs:
  X:
    shape: [BATCH, IN_FEAT]
    dtype: inherit
inits:
  - dim: IN_FEAT
  - dim: OUT_FEAT
  - dim: BN_EPS
  - dim: BN_MOMENTUM
  - dim: BIAS_SHAPE
  - dim: DIVIDE_VALUE
ci:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 16
      IN_FEAT: 128
      OUT_FEAT: 128
      BN_EPS: 1.0e-05
      BN_MOMENTUM: 0.1
      DIVIDE_VALUE: 1.0
      BIAS_SHAPE: [1]
      BATCH_SIZE: 16
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 1024
      IN_FEAT: 8192
      OUT_FEAT: 8192
      BN_EPS: 1.0e-05
      BN_MOMENTUM: 0.1
      DIVIDE_VALUE: 1.0
      BIAS_SHAPE: [1]
      BATCH_SIZE: 1024
    flop: "2*BATCH*IN_FEAT*OUT_FEAT"
