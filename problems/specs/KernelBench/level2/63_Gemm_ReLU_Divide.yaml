# KernelBench YAML config for 63_Gemm_ReLU_Divide
inputs:
  X:
    shape: [BATCH, IN_FEAT]
    dtype: inherit
inits:
  - dim: IN_FEAT
  - dim: OUT_FEAT
  - dim: DIVISOR
ci:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 16
      IN_FEAT: 128
      OUT_FEAT: 128
      DIVISOR: 2.0
      BATCH_SIZE: 16
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 1024
      IN_FEAT: 8192
      OUT_FEAT: 8192
      DIVISOR: 2.0
      BATCH_SIZE: 1024
    flop: "2*BATCH*IN_FEAT*OUT_FEAT"
