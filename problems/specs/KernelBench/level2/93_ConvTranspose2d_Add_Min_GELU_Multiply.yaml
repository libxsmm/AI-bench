# KernelBench YAML config for 93_ConvTranspose2d_Add_Min_GELU_Multiply
inputs:
  X:
    shape: [BATCH, IN_CHANNELS, HEIGHT, WIDTH]
    dtype: inherit
inits:
  - dim: IN_CHANNELS
  - dim: OUT_CHANNELS
  - dim: KERNEL_SIZE
  - dim: STRIDE
  - dim: ADD_VALUE
  - dim: MULTIPLY_VALUE
ci:
  - params: [X]
    dtype: float32
    dims:
      BATCH: 2
      IN_CHANNELS: 64
      OUT_CHANNELS: 2
      HEIGHT: 64
      WIDTH: 64
      KERNEL_SIZE: 4
      STRIDE: 2
      ADD_VALUE: 0.5
      MULTIPLY_VALUE: 2.0
      BATCH_SIZE: 2
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 128
      IN_CHANNELS: 64
      OUT_CHANNELS: 128
      HEIGHT: 64
      WIDTH: 64
      KERNEL_SIZE: 4
      STRIDE: 2
      ADD_VALUE: 0.5
      MULTIPLY_VALUE: 2.0
      BATCH_SIZE: 128
    flop: "2*BATCH*IN_CHANNELS*OUT_CHANNELS*KERNEL_SIZE*KERNEL_SIZE*HEIGHT*WIDTH"
