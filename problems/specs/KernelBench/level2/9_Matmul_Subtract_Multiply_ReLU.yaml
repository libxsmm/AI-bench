# KernelBench YAML config for 9_Matmul_Subtract_Multiply_ReLU
inputs:
  X:
    shape: [BATCH, IN_FEAT]
    dtype: inherit
inits:
  - dim: IN_FEAT
  - dim: OUT_FEAT
  - dim: SUBTRACT_VALUE
  - dim: MULTIPLY_VALUE
ci:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 16
      IN_FEAT: 128
      OUT_FEAT: 128
      SUBTRACT_VALUE: 2.0
      MULTIPLY_VALUE: 1.5
      BATCH_SIZE: 16
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 1024
      IN_FEAT: 8192
      OUT_FEAT: 8192
      SUBTRACT_VALUE: 2.0
      MULTIPLY_VALUE: 1.5
      BATCH_SIZE: 1024
    flop: "2*BATCH*IN_FEAT*OUT_FEAT"
