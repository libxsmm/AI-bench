# KernelBench YAML config for 26_ConvTranspose3d_Add_HardSwish
inputs:
  X:
    shape: [BATCH, IN_CHANNELS, DEPTH, HEIGHT, WIDTH]
    dtype: inherit
  ADD_INPUT:
    shape: [BATCH, OUT_CHANNELS, DOUT, HOUT, WOUT]
    dtype: inherit
inits:
  - dim: IN_CHANNELS
  - dim: OUT_CHANNELS
  - dim: KERNEL_SIZE
  - dim: STRIDE
  - dim: PADDING
  - dim: OUTPUT_PADDING
  - dim: BIAS_SHAPE
ci:
  - params: [X, ADD_INPUT]
    dtype: float32
    dims:
      BATCH: 2
      IN_CHANNELS: 32
      OUT_CHANNELS: 64
      KERNEL_SIZE: 3
      DEPTH: 16
      HEIGHT: 16
      WIDTH: 16
      DOUT: 32
      HOUT: 32
      WOUT: 32
      STRIDE: 2
      PADDING: 1
      OUTPUT_PADDING: 1
      BIAS_SHAPE: [64, 1, 1, 1, 1]
      BATCH_SIZE: 2
      D: 16
      H: 16
      W: 16
bench-gpu:

  - params: [X, ADD_INPUT]
    dtype: float16
    dims:
      BATCH: 128
      IN_CHANNELS: 32
      OUT_CHANNELS: 64
      KERNEL_SIZE: 3
      DEPTH: 16
      HEIGHT: 16
      WIDTH: 16
      DOUT: 32
      HOUT: 32
      WOUT: 32
      STRIDE: 2
      PADDING: 1
      OUTPUT_PADDING: 1
      BIAS_SHAPE: [64, 1, 1, 1, 1]
      BATCH_SIZE: 128
      D: 16
      H: 16
      W: 16
    flop: "2*BATCH*IN_CHANNELS*OUT_CHANNELS*KERNEL_SIZE**3*DEPTH*HEIGHT*WIDTH"
