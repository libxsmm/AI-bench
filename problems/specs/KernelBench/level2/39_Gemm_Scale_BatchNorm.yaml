# KernelBench YAML config for 39_Gemm_Scale_BatchNorm
inputs:
  X:
    shape: [BATCH, IN_FEAT]
    dtype: inherit
inits:
  - dim: IN_FEAT
  - dim: OUT_FEAT
  - dim: SCALE_SHAPE
ci:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 256
      IN_FEAT: 64
      OUT_FEAT: 64
      SCALE_SHAPE: [64]
      EPS: 1.0e-05
      MOMENTUM: 0.1
      BATCH_SIZE: 256
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 16384
      IN_FEAT: 4096
      OUT_FEAT: 4096
      SCALE_SHAPE: [4096]
      EPS: 1.0e-05
      MOMENTUM: 0.1
      BATCH_SIZE: 16384
    flop: "2*BATCH*IN_FEAT*OUT_FEAT"
