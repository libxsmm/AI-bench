# KernelBench YAML config for 7_Conv3d_ReLU_LeakyReLU_GELU_Sigmoid_BiasAdd
inputs:
  X:
    shape: [BATCH, IN_CHANNELS, DEPTH, HEIGHT, WIDTH]
    dtype: inherit
inits:
  - dim: IN_CHANNELS
  - dim: OUT_CHANNELS
  - dim: KERNEL_SIZE
  - dim: BIAS_SHAPE
ci:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 64
      IN_CHANNELS: 8
      OUT_CHANNELS: 16
      DEPTH: 8
      HEIGHT: 8
      WIDTH: 8
      KERNEL_SIZE: 3
      BIAS_SHAPE: [16, 1, 1, 1]
      BATCH_SIZE: 64
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 64
      IN_CHANNELS: 8
      OUT_CHANNELS: 32
      DEPTH: 32
      HEIGHT: 64
      WIDTH: 64
      KERNEL_SIZE: 3
      BIAS_SHAPE: [32, 1, 1, 1]
      BATCH_SIZE: 64
    flop: "2*BATCH*IN_CHANNELS*OUT_CHANNELS*KERNEL_SIZE**3*(DEPTH-KERNEL_SIZE+1)*(HEIGHT-KERNEL_SIZE+1)*(WIDTH-KERNEL_SIZE+1)"
