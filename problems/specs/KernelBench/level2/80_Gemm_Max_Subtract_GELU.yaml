inputs:
  X:
    shape: [BATCH_SIZE, IN_FEATURES]
    dtype: inherit

inits:
  - dim: IN_FEATURES
  - dim: OUT_FEATURES
  - dim: MAX_DIM

ci:
  - params: [X]
    dtype: float32
    dims:
      BATCH_SIZE: 2
      IN_FEATURES: 32
      OUT_FEATURES: 32
      MAX_DIM: 1

simple-cpu:
  - params: [X]
    dtype: bfloat16
    dims:
      BATCH_SIZE: 2
      IN_FEATURES: 256
      OUT_FEATURES: 256
      MAX_DIM: 1
