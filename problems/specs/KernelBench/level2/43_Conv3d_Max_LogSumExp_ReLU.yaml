# KernelBench YAML config for 43_Conv3d_Max_LogSumExp_ReLU
inputs:
  X:
    shape: [BATCH, IN_CHANNELS, DEPTH, HEIGHT, WIDTH]
    dtype: inherit
inits:
  - dim: IN_CHANNELS
  - dim: OUT_CHANNELS
  - dim: KERNEL_SIZE
  - dim: STRIDE
  - dim: PADDING
ci:
  - params: [X]
    dtype: float32
    dims:
      BATCH: 4
      IN_CHANNELS: 32
      OUT_CHANNELS: 64
      DEPTH: 32
      HEIGHT: 2
      WIDTH: 2
      KERNEL_SIZE: 3
      STRIDE: 1
      PADDING: 1
      BATCH_SIZE: 4
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 4
      IN_CHANNELS: 32
      OUT_CHANNELS: 64
      DEPTH: 32
      HEIGHT: 128
      WIDTH: 128
      KERNEL_SIZE: 3
      STRIDE: 1
      PADDING: 1
      BATCH_SIZE: 4
    flop: "2*BATCH*IN_CHANNELS*OUT_CHANNELS*KERNEL_SIZE**3*(DEPTH+2*PADDING-KERNEL_SIZE+1)*(HEIGHT+2*PADDING-KERNEL_SIZE+1)*(WIDTH+2*PADDING-KERNEL_SIZE+1)"
