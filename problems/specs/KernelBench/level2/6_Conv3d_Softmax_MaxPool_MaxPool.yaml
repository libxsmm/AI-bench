# KernelBench YAML config for 6_Conv3d_Softmax_MaxPool_MaxPool
inputs:
  X:
    shape: [BATCH, IN_CHANNELS, DEPTH, HEIGHT, WIDTH]
    dtype: inherit
inits:
  - dim: IN_CHANNELS
  - dim: OUT_CHANNELS
  - dim: KERNEL_SIZE
  - dim: POOL_KERNEL_SIZE
ci:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 2
      IN_CHANNELS: 3
      OUT_CHANNELS: 16
      DEPTH: 16
      HEIGHT: 32
      WIDTH: 32
      KERNEL_SIZE: 3
      POOL_KERNEL_SIZE: 2
      BATCH_SIZE: 2
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 128
      IN_CHANNELS: 3
      OUT_CHANNELS: 16
      DEPTH: 16
      HEIGHT: 32
      WIDTH: 32
      KERNEL_SIZE: 3
      POOL_KERNEL_SIZE: 2
      BATCH_SIZE: 128
    flop: "2*BATCH*IN_CHANNELS*OUT_CHANNELS*KERNEL_SIZE**3*(DEPTH-KERNEL_SIZE+1)*(HEIGHT-KERNEL_SIZE+1)*(WIDTH-KERNEL_SIZE+1)"
