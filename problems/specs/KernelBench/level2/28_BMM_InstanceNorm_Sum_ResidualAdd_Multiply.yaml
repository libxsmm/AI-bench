# KernelBench YAML config for 28_BMM_InstanceNorm_Sum_ResidualAdd_Multiply
inputs:
  X:
    shape: [BATCH, IN_FEAT]
    dtype: inherit
  Y:
    shape: [BATCH, OUT_FEAT]
    dtype: inherit
inits:
  - dim: IN_FEAT
  - dim: OUT_FEAT
ci:
  - params: [X, Y]
    dtype: float32
    dims:
      BATCH: 16
      OUT_FEAT: 128
      IN_FEAT: 128
      EPS: 1.0e-05
      MOMENTUM: 0.1
      BATCH_SIZE: 16
bench-gpu:
  - params: [X, Y]
    dtype: float16
    dims:
      BATCH: 1024
      OUT_FEAT: 8192
      IN_FEAT: 8192
      EPS: 1.0e-05
      MOMENTUM: 0.1
      BATCH_SIZE: 1024
    flop: "2*BATCH*IN_FEAT*OUT_FEAT"
