inputs:
  X:
    shape: [BATCH_SIZE, INPUT_SIZE]
    dtype: inherit

inits:
  - dim: INPUT_SIZE
  - dim: OUTPUT_SIZE
  - dim: DIVISOR

ci:
  - params: [X]
    dtype: float32
    dims:
      BATCH_SIZE: 2
      INPUT_SIZE: 32
      OUTPUT_SIZE: 32
      DIVISOR: 10.0

simple-cpu:
  - params: [X]
    dtype: bfloat16
    dims:
      BATCH_SIZE: 64
      INPUT_SIZE: 1024
      OUTPUT_SIZE: 1024
      DIVISOR: 10.0

bench-cpu:
  - params: [X]
    dtype: bfloat16
    dims:
      BATCH_SIZE: 1024
      INPUT_SIZE: 8192
      OUTPUT_SIZE: 8192
      DIVISOR: 10.0
    atol: 1.e-4
