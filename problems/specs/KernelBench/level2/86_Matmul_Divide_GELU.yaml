# KernelBench YAML config for 86_Matmul_Divide_GELU
inputs:
  X:
    shape: [BATCH, IN_FEAT]
    dtype: inherit
inits:
  - dim: INPUT_SIZE
  - dim: OUTPUT_SIZE
  - dim: DIVISOR
ci:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 16
      IN_FEAT: 128
      OUT_FEAT: 64
      DIVISOR: 10.0
      BATCH_SIZE: 16
      INPUT_SIZE: 128
      OUTPUT_SIZE: 128
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 1024
      IN_FEAT: 8192
      OUT_FEAT: 4096
      DIVISOR: 10.0
      BATCH_SIZE: 1024
      INPUT_SIZE: 8192
      OUTPUT_SIZE: 8192
    flop: "2*BATCH*INPUT_SIZE*OUTPUT_SIZE"
