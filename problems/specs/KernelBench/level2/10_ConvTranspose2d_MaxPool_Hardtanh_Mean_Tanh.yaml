# KernelBench YAML config for 10_ConvTranspose2d_MaxPool_Hardtanh_Mean_Tanh
inputs:
  X:
    shape: [BATCH, IN_CHANNELS, HEIGHT, WIDTH]
    dtype: inherit
inits:
  - dim: IN_CHANNELS
  - dim: OUT_CHANNELS
  - dim: KERNEL_SIZE
  - dim: STRIDE
  - dim: PADDING
  - dim: MAXPOOL_KERNEL_SIZE
  - dim: MAXPOOL_STRIDE
  - dim: HARDTANH_MIN
  - dim: HARDTANH_MAX
ci:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 2
      IN_CHANNELS: 64
      OUT_CHANNELS: 64
      KERNEL_SIZE: 3
      HEIGHT: 4
      WIDTH: 4
      STRIDE: 1
      PADDING: 1
      MAXPOOL_KERNEL_SIZE: 2
      MAXPOOL_STRIDE: 2
      HARDTANH_MIN: -1
      HARDTANH_MAX: 1
      BATCH_SIZE: 2
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 128
      IN_CHANNELS: 64
      OUT_CHANNELS: 64
      KERNEL_SIZE: 3
      HEIGHT: 256
      WIDTH: 256
      STRIDE: 1
      PADDING: 1
      MAXPOOL_KERNEL_SIZE: 2
      MAXPOOL_STRIDE: 2
      HARDTANH_MIN: -1
      HARDTANH_MAX: 1
      BATCH_SIZE: 128
    flop: "2*BATCH*IN_CHANNELS*OUT_CHANNELS*KERNEL_SIZE*KERNEL_SIZE*HEIGHT*WIDTH"
