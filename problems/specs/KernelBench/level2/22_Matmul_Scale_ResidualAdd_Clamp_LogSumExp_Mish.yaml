# KernelBench YAML config for 22_Matmul_Scale_ResidualAdd_Clamp_LogSumExp_Mish
inputs:
  X:
    shape: [BATCH, IN_FEAT]
    dtype: inherit
inits:
  - dim: INPUT_SIZE
  - dim: HIDDEN_SIZE
  - dim: SCALE_FACTOR
  - dim: CLAMP_MIN
  - dim: CLAMP_MAX
ci:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 16
      IN_FEAT: 128
      OUT_FEAT: 64
      SCALE_FACTOR: 2.0
      CLAMP_MIN: -10.0
      CLAMP_MAX: 10.0
      BATCH_SIZE: 16
      INPUT_SIZE: 128
      HIDDEN_SIZE: 128
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 1024
      IN_FEAT: 8192
      OUT_FEAT: 4096
      SCALE_FACTOR: 2.0
      CLAMP_MIN: -10.0
      CLAMP_MAX: 10.0
      BATCH_SIZE: 1024
      INPUT_SIZE: 8192
      HIDDEN_SIZE: 8192
    flop: "2*BATCH*INPUT_SIZE*HIDDEN_SIZE"
