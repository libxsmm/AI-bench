inputs:
  X:
    shape: [BATCH_SIZE, IN_FEATURES]
    dtype: inherit

inits:
  - dim: IN_FEATURES
  - dim: OUT_FEATURES
  - dim: BIAS_SHAPE

ci:
  - params: [X]
    dtype: float32
    dims:
      BATCH_SIZE: 2
      IN_FEATURES: 32
      OUT_FEATURES: 32
      BIAS_SHAPE: [32] # TODO: bind these to other dims

simple-cpu:
  - params: [X]
    dtype: bfloat16
    dims:
      BATCH_SIZE: 32
      IN_FEATURES: 256
      OUT_FEATURES: 256
      BIAS_SHAPE: [256] # TODO: bind these to other dims
    atol: 3.5e-2

bench-cpu:
  - params: [X]
    dtype: bfloat16
    dims:
      BATCH_SIZE: 1024
      IN_FEATURES: 8192
      OUT_FEATURES: 8192
      BIAS_SHAPE: [8192] # TODO: bind these to other dims
    atol: 3.5e-2
