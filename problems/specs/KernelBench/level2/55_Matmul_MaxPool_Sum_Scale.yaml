# KernelBench YAML config for 55_Matmul_MaxPool_Sum_Scale
inputs:
  X:
    shape: [BATCH, IN_FEAT]
    dtype: inherit
inits:
  - dim: IN_FEAT
  - dim: OUT_FEAT
  - dim: KERNEL_SIZE
  - dim: SCALE_FACTOR
ci:
  - params: [X]
    dtype: float32
    dims:
      BATCH: 2
      IN_FEAT: 512
      OUT_FEAT: 512
      POOL_KERNEL_SIZE: 2
      KERNEL_SIZE: 2
      SCALE_FACTOR: 0.5
      BATCH_SIZE: 2
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 128
      IN_FEAT: 32768
      OUT_FEAT: 32768
      POOL_KERNEL_SIZE: 2
      KERNEL_SIZE: 2
      SCALE_FACTOR: 0.5
      BATCH_SIZE: 128
    flop: "2*BATCH*IN_FEAT*OUT_FEAT"
