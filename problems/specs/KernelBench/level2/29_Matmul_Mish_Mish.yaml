inputs:
  X:
    shape: [BATCH_SIZE, IN_FEATURES]
    dtype: inherit

inits:
  - dim: IN_FEATURES
  - dim: OUT_FEATURES

ci:
  - params: [X]
    dtype: float32
    dims:
      BATCH_SIZE: 2
      IN_FEATURES: 64
      OUT_FEATURES: 64

mlir-gpu-bench:
  - params: [X]
    dtype: bfloat16
    dims:
      BATCH_SIZE: 1024
      IN_FEATURES: 8192
      OUT_FEATURES: 8192
