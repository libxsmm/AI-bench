# KernelBench YAML config for 84_Gemm_BatchNorm_Scaling_Softmax
inputs:
  X:
    shape: [BATCH, IN_FEAT]
    dtype: inherit
inits:
  - dim: IN_FEAT
  - dim: OUT_FEAT
  - dim: BN_EPS
  - dim: BN_MOMENTUM
  - dim: SCALE_SHAPE
ci:
  - params: [X]
    dtype: float32
    dims:
      BATCH: 16
      IN_FEAT: 128
      OUT_FEAT: 128
      BN_EPS: 1.0e-05
      BN_MOMENTUM: 0.1
      SCALE_SHAPE: [1]
      BATCH_SIZE: 16
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 1024
      IN_FEAT: 8192
      OUT_FEAT: 8192
      BN_EPS: 1.0e-05
      BN_MOMENTUM: 0.1
      SCALE_SHAPE: [1]
      BATCH_SIZE: 1024
    flop: "2*BATCH*IN_FEAT*OUT_FEAT"
