# KernelBench YAML config for 8_Conv3d_Divide_Max_GlobalAvgPool_BiasAdd_Sum
inputs:
  X:
    shape: [BATCH, IN_CHANNELS, DEPTH, HEIGHT, WIDTH]
    dtype: inherit
inits:
  - dim: IN_CHANNELS
  - dim: OUT_CHANNELS
  - dim: KERNEL_SIZE
  - dim: DIVISOR
  - dim: POOL_SIZE
  - dim: BIAS_SHAPE
  - dim: SUM_DIM
ci:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 2
      IN_CHANNELS: 8
      OUT_CHANNELS: 16
      DEPTH: 16
      HEIGHT: 64
      WIDTH: 64
      KERNEL_SIZE: [3, 3, 3]
      DIVISOR: 2.0
      POOL_SIZE: [2, 2, 2]
      BIAS_SHAPE: [16, 1, 1, 1]
      SUM_DIM: 1
      BATCH_SIZE: 2
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 128
      IN_CHANNELS: 8
      OUT_CHANNELS: 16
      DEPTH: 16
      HEIGHT: 64
      WIDTH: 64
      KERNEL_SIZE: [3, 3, 3]
      DIVISOR: 2.0
      POOL_SIZE: [2, 2, 2]
      BIAS_SHAPE: [16, 1, 1, 1]
      SUM_DIM: 1
      BATCH_SIZE: 128
    flop: "2*BATCH*IN_CHANNELS*OUT_CHANNELS*27*(DEPTH-3+1)*(HEIGHT-3+1)*(WIDTH-3+1)"
