# KernelBench YAML config for 21_Conv2d_Add_Scale_Sigmoid_GroupNorm
inputs:
  X:
    shape: [BATCH, IN_CHANNELS, HEIGHT, WIDTH]
    dtype: inherit
inits:
  - dim: IN_CHANNELS
  - dim: OUT_CHANNELS
  - dim: KERNEL_SIZE
  - dim: NUM_GROUPS
  - dim: BIAS_SHAPE
  - dim: SCALE_SHAPE
ci:
  - params: [X]
    dtype: float32
    dims:
      BATCH: 2
      IN_CHANNELS: 8
      OUT_CHANNELS: 16
      HEIGHT: 16
      WIDTH: 16
      KERNEL_SIZE: 3
      NUM_GROUPS: 4
      BIAS_SHAPE: [16, 1, 1]
      SCALE_SHAPE: [16, 1, 1]
      BATCH_SIZE: 2
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 128
      IN_CHANNELS: 8
      OUT_CHANNELS: 32
      HEIGHT: 256
      WIDTH: 256
      KERNEL_SIZE: 3
      NUM_GROUPS: 8
      BIAS_SHAPE: [32, 1, 1]
      SCALE_SHAPE: [32, 1, 1]
      BATCH_SIZE: 128
    flop: "2*BATCH*IN_CHANNELS*OUT_CHANNELS*KERNEL_SIZE*KERNEL_SIZE*(HEIGHT-KERNEL_SIZE+1)*(WIDTH-KERNEL_SIZE+1)"
