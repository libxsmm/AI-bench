# KernelBench YAML config for 30_Gemm_GroupNorm_Hardtanh
inputs:
  X:
    shape: [BATCH, IN_FEAT]
    dtype: inherit
inits:
  - dim: IN_FEAT
  - dim: OUT_FEAT
  - dim: NUM_GROUPS
  - dim: HARDTANH_MIN
  - dim: HARDTANH_MAX
ci:
  - params: [X]
    dtype: float32
    dims:
      BATCH: 16
      IN_FEAT: 128
      OUT_FEAT: 128
      NUM_GROUPS: 16
      HARDTANH_MIN: -2.0
      HARDTANH_MAX: 2.0
      BATCH_SIZE: 16
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 1024
      IN_FEAT: 8192
      OUT_FEAT: 8192
      NUM_GROUPS: 16
      HARDTANH_MIN: -2.0
      HARDTANH_MAX: 2.0
      BATCH_SIZE: 1024
    flop: "2*BATCH*IN_FEAT*OUT_FEAT"
