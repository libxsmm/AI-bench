# KernelBench YAML config for 60_ConvTranspose3d_Swish_GroupNorm_HardSwish
inputs:
  X:
    shape: [BATCH, IN_CHANNELS, DEPTH, HEIGHT, WIDTH]
    dtype: inherit
inits:
  - dim: IN_CHANNELS
  - dim: OUT_CHANNELS
  - dim: KERNEL_SIZE
  - dim: STRIDE
  - dim: PADDING
  - dim: GROUPS
  - dim: EPS
ci:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 2
      IN_CHANNELS: 3
      OUT_CHANNELS: 16
      DEPTH: 16
      HEIGHT: 32
      WIDTH: 32
      KERNEL_SIZE: 3
      STRIDE: 2
      PADDING: 1
      GROUPS: 4
      EPS: 1.0e-05
      NUM_GROUPS: 16
      BIAS: true
      BATCH_SIZE: 2
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 128
      IN_CHANNELS: 3
      OUT_CHANNELS: 16
      DEPTH: 16
      HEIGHT: 32
      WIDTH: 32
      KERNEL_SIZE: 3
      STRIDE: 2
      PADDING: 1
      GROUPS: 4
      EPS: 1.0e-05
      NUM_GROUPS: 16
      BIAS: true
      BATCH_SIZE: 128
    flop: "2*BATCH*IN_CHANNELS*OUT_CHANNELS*KERNEL_SIZE**3*DEPTH*HEIGHT*WIDTH"
