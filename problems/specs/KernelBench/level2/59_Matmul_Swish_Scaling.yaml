inputs:
  X:
    shape: [BATCH_SIZE, IN_FEATURES]
    dtype: inherit

inits:
  - dim: IN_FEATURES
  - dim: OUT_FEATURES
  - dim: SCALING_FACTOR

ci:
  - params: [X]
    dtype: float32
    dims:
      BATCH_SIZE: 2
      IN_FEATURES: 32
      OUT_FEATURES: 32
      SCALING_FACTOR: 2.0

simple-cpu:
  - params: [X]
    dtype: bfloat16
    dims:
      BATCH_SIZE: 32
      IN_FEATURES: 256
      OUT_FEATURES: 256
      SCALING_FACTOR: 2.0
    atol: 2.e-2

bench-cpu:
  - params: [X]
    dtype: bfloat16
    dims:
      BATCH_SIZE: 128
      IN_FEATURES: 32768
      OUT_FEATURES: 32768
      SCALING_FACTOR: 2.0
    atol: 5.e-2
