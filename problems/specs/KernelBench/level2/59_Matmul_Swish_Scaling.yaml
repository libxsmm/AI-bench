# KernelBench YAML config for 59_Matmul_Swish_Scaling
inputs:
  X:
    shape: [BATCH, IN_FEAT]
    dtype: inherit
inits:
  - dim: IN_FEAT
  - dim: OUT_FEAT
  - dim: SCALING_FACTOR
ci:
  - params: [X]
    dtype: float32
    dims:
      BATCH: 2
      IN_FEAT: 512
      OUT_FEAT: 512
      SCALING_FACTOR: 2.0
      BATCH_SIZE: 2
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 128
      IN_FEAT: 8192
      OUT_FEAT: 8192
      SCALING_FACTOR: 2.0
      BATCH_SIZE: 128
    flop: "2*BATCH*IN_FEAT*OUT_FEAT"
