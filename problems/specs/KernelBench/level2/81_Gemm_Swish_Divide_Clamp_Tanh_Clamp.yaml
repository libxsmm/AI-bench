inputs:
  X:
    shape: [BATCH, IN_FEAT]
    dtype: inherit

inits:
  - dim: IN_FEAT
  - dim: OUT_FEAT

ci:
  - params: [X]
    dtype: float32
    dims:
      BATCH: 2
      IN_FEAT: 64
      OUT_FEAT: 64
    flop: "2*BATCH*IN_FEAT*OUT_FEAT"

bench-cpu:
  - params: [X]
    dtype: bfloat16
    dims:
      BATCH: 1024
      IN_FEAT: 8192
      OUT_FEAT: 8192
    flop: "2*BATCH*IN_FEAT*OUT_FEAT"
    atol: 1.e-3

