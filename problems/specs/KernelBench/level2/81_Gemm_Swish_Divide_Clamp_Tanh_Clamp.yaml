# KernelBench YAML config for 81_Gemm_Swish_Divide_Clamp_Tanh_Clamp
inputs:
  X:
    shape: [BATCH, IN_FEAT]
    dtype: inherit
inits:
  - dim: IN_FEAT
  - dim: OUT_FEAT
ci:
  - params: [X]
    dtype: float32
    dims:
      BATCH: 16
      IN_FEAT: 128
      OUT_FEAT: 128
      BIAS: true
      BATCH_SIZE: 16
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 1024
      IN_FEAT: 8192
      OUT_FEAT: 8192
      BIAS: true
      BATCH_SIZE: 1024
    flop: "2*BATCH*IN_FEAT*OUT_FEAT"
