# KernelBench YAML config for 98_Matmul_AvgPool_GELU_Scale_Max
inputs:
  X:
    shape: [BATCH, IN_FEAT]
    dtype: inherit
inits:
  - dim: IN_FEAT
  - dim: OUT_FEAT
  - dim: POOL_KERNEL_SIZE
  - dim: SCALE_FACTOR
ci:
  - params: [X]
    dtype: float32
    dims:
      BATCH: 16
      IN_FEAT: 128
      OUT_FEAT: 128
      POOL_KERNEL_SIZE: 16
      SCALE_FACTOR: 2.0
      BATCH_SIZE: 16
bench-gpu:
  - params: [X]
    dtype: float16
    dims:
      BATCH: 1024
      IN_FEAT: 8192
      OUT_FEAT: 8192
      POOL_KERNEL_SIZE: 16
      SCALE_FACTOR: 2.0
      BATCH_SIZE: 1024
    flop: "2*BATCH*IN_FEAT*OUT_FEAT"
