inputs:
  x:
    shape: [BATCH_SIZE, DIM1, DIM2]
    dtype: inherit

inits:
  - dim: REDUCE_DIM

ci:
  - params: [x]
    dtype: float32
    dims:
      BATCH_SIZE: 2
      DIM1: 64
      DIM2: 63
      REDUCE_DIM: 1

bench-cpu:
  - params: ['x']
    dtype: bfloat16
    dims:
      BATCH_SIZE: 128
      DIM1: 1024
      DIM2: 1023
      REDUCE_DIM: 1
    flop: "BATCH_SIZE*DIM1*DIM2"
