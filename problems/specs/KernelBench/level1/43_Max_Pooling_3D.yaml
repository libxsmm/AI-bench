    dtype: float32
    dims:
      BATCH_SIZE: 2
      FEATURES: 4
      DIM1: 16
      DIM2: 16
      DIM3: 16

simple-cpu:
  - params: [x]
    dtype: float32
    dims:
      BATCH_SIZE: 2
      FEATURES: 4
      DIM1: 16
      DIM2: 16
      DIM3: 16
