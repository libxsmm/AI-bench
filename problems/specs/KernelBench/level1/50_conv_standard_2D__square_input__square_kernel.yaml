inputs:
  x:
    shape: [BATCH_SIZE, IN_CHANNELS, HEIGHT, WIDTH]
    dtype: inherit

inits:
  - dim: NUM_CLASSES

ci:
  - params: [x]
    dtype: float32
    dims:
      BATCH_SIZE: 2
      NUM_CLASSES: 10
      IN_CHANNELS: 3
      HEIGHT: 64
      WIDTH: 64

bench-cpu:
  - params: ['x']
    dtype: bfloat16
    dims:
      BATCH_SIZE: 128
      NUM_CLASSES: 1000
      IN_CHANNELS: 3
      HEIGHT: 224
      WIDTH: 224
    flop: "2*BATCH_SIZE*IN_CHANNELS*HEIGHT*WIDTH*NUM_CLASSES"
