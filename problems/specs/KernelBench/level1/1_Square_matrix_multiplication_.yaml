inputs:
  A:
    shape: [N, N]
    dtype: inherit
  B:
    shape: [N, N]
    dtype: inherit

ci:
  - params: [A, B]
    dtype: float32
    dims:
      N: 128

bench-cpu:
  - params: [A, B]
    dtype: float32
    dims:
      N: 512
    flop: "2*N*N*N"
    mem_bytes: "3*N*N * 4" # f32
  - params: [A, B]
    dtype: bfloat16
    dims:
      N: 1024
    flop: "2*N*N*N"
    mem_bytes: "3*N*N * 2" # bf16
  - params: [A, B]
    dtype: bfloat16
    dims:
      N: 8192
    flop: "2*N*N*N"
    mem_bytes: "3*N*N * 2" # bf16
    atol: 2  # long accumulation chain requires higher tolerances
    rtol: 10

bench-gpu:
  - params: [A, B]
    dtype: float16
    dims:
      N: 1024
    flop: "2*N*N*N"
    rtol: 1.0e-03
    atol: 1.0e-05
  - params: [A, B]
    dtype: float16
    dims:
      N: 2048
    flop: "2*N*N*N"
    rtol: 1.0e-03
    atol: 1.0e-05
  - params: [A, B]
    dtype: float16
    dims:
      N: 4096
    flop: "2*N*N*N"
    rtol: 1.0e-03
    atol: 1.0e-05
