inputs:
  A:
    shape: [M, K]
    dtype: inherit
  B:
    shape: [K, N]
    dtype: inherit

ci:
  - params: [A, B]
    dtype: float32
    dims:
      M: 64
      N: 128
      K: 256

simple-cpu:
  - params: [A, B]
    dtype: bfloat16
    dims:
      M: 512
      N: 1024
      K: 256

bench-cpu:
  - params: [A, B]
    dtype: bfloat16
    dims:
    - M: 3072
      N: 3072
      K: 4096
    - M: 2048
      N: 2048
      K: 8192
    atol: 1
    flop: "2*M*N*K"
    mem_bytes: "(M*K + K*N + M*N) * 2" # bf16

mlir-cpu-bench:
  - params: [A, B]
    dtype: float32
    dims:
      M: 2048
      N: 4096
      K: 8192
    atol: 1
    flop: "2*M*N*K"
    mem_bytes: "(M*K + K*N + M*N) * 4" # f32
  - params: [A, B]
    dtype: bfloat16
    dims:
      M: 2048
      N: 4096
      K: 8192
    atol: 1
    flop: "2*M*N*K"
    mem_bytes: "(M*K + K*N + M*N) * 2" # bf16

bench-gpu:
  - params: [A, B]
    dtype: float16
    dims:
      M: 3072
      N: 3072
      K: 4096
    flop: "2*M*N*K"
    mem_bytes: "(M*K + K*N + M*N) * 2" # f16
    rtol: 1.0e-03
    atol: 1.0e-05
