inputs:
  A:
    shape: [M, K]
    dtype: inherit
  B:
    shape: [K, N]
    dtype: inherit

ci:
  - params: [A, B]
    dtype: float32
    dims:
      M: 64
      N: 128
      K: 256

bench-cpu:
  - params: [A, B]
    dtype: bfloat16
    dims:
      M: 6144
      N: 6144
      K: 8192
    flop: "2*M*N*K"
    mem_bytes: "(M*K + K*N + M*N) * 2" # f16
    atol: 2  # long accumulation chain requires higher tolerance
    rtol: 4

bench-gpu:
  - params: [A, B]
    dtype: float16
    dims:
      M: 3072
      N: 3072
      K: 4096
    flop: "2*M*N*K"
    mem_bytes: "(M*K + K*N + M*N) * 2" # f16
    rtol: 1.0e-03
    atol: 1.0e-05
