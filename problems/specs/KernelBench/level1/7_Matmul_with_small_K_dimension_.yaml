inputs:
  A:
    shape: [M, K]
    dtype: inherit
  B:
    shape: [K, N]
    dtype: inherit

ci:
  - params: [A, B]
    dtype: float32
    dims:
      M: 256
      N: 256
      K: 16
    flop: "2*M*N*K"

simple-cpu:
  - params: [A, B]
    dtype: bfloat16
    dims:
      M: 512
      N: 512
      K: 32
    flop: "2*M*N*K"

bench-cpu:
  - params: [A, B]
    dtype: bfloat16
    dims:
      M: 8192
      N: 8192
      K: 64
    flop: "2*M*N*K"

mlir-cpu-bench:
  - params: [A, B]
    dtype: float32
    dims:
      M: 4096
      N: 4096
      K: 64
    flop: "2*M*N*K"
  - params: [A, B]
    dtype: bfloat16
    dims:
      M: 4096
      N: 4096
      K: 64
    flop: "2*M*N*K"

mlir-gpu-bench:
  - params: [A, B]
    dtype: bfloat16
    dims:
      M: 32768
      N: 32768
      K: 64
    flop: "2*M*N*K"

bench-gpu:
  - params: [A, B]
    dtype: float16
    dims:
      M: 8192
      N: 8192
      K: 64
    flop: "2*M*N*K"
    rtol: 1.0e-03
    atol: 1.0e-05
