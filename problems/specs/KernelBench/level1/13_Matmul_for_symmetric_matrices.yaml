inputs:
  A:
    shape: [N, N]
    dtype: inherit
    inits: [symmetric]
  B:
    shape: [N, N]
    dtype: inherit
    inits: [symmetric]

inits: []

ci:
  - params: [A, B]
    dtype: float32
    dims:
      N: 64

bench-cpu:
  - params: ['A', 'B']
    dtype: bfloat16
    dims:
      N: 1024
    flop: "2*N*N*N"
