inputs:
  x:
    shape: [BATCH_SIZE, DIM]
    dtype: inherit

inits: []

ci:
  - params: [x]
    dtype: float32
    dims:
      BATCH_SIZE: 128
      DIM: 512
    flop: "5*BATCH_SIZE*DIM"

simple-cpu:
  - params: [x]
    dtype: float32
    dims:
      BATCH_SIZE: 128
      DIM: 512
    flop: "5*BATCH_SIZE*DIM"

bench-cpu:
  - params: [x]
    dtype: float32
    dims:
      BATCH_SIZE: 4096
      DIM: 393216
    flop: "5*BATCH_SIZE*DIM"
    mem_bytes: "(2*BATCH_SIZE*DIM) * 4" # f32

mlir-gpu-bench:
  - params: [x]
    dtype: bfloat16
    dims:
      BATCH_SIZE: 4096
      DIM: 393216
    flop: "5*BATCH_SIZE*DIM"
    mem_bytes: "(2*BATCH_SIZE*DIM) * 2" # bf16
