inputs:
  A:
    shape: [M, M]
    dtype: inherit
    inits: [tril]
  B:
    shape: [M, M]
    dtype: inherit
    inits: [tril]

inits: []

ci:
  - params: [A, B]
    dtype: float32
    dims:
      M: 64

bench-cpu:
  - params: ['A', 'B']
    dtype: bfloat16
    dims:
      M: 1024
    flop: "M*M*M"
