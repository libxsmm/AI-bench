inputs:
  x:
    shape: [BATCH_SIZE, CHANNELS, HEIGHT, WIDTH]
    dtype: inherit

inits:
  - dim: KERNEL_SIZE
  - dim: STRIDE
  - dim: PADDING
  - dim: DILATION

ci:
  - params: [x]
    dtype: float32
    dims:
      BATCH_SIZE: 2
      CHANNELS: 8
      HEIGHT: 32
      WIDTH: 32
      KERNEL_SIZE: 2
      STRIDE: 1
      PADDING: 1
      DILATION: 1

bench-cpu:
  - params: ['x']
    dtype: bfloat16
    dims:
      BATCH_SIZE: 4
      CHANNELS: 32
      HEIGHT: 256
      WIDTH: 256
      KERNEL_SIZE: 4
      STRIDE: 1
      PADDING: 1
      DILATION: 1
    flop: "BATCH_SIZE*CHANNELS*HEIGHT*WIDTH"
