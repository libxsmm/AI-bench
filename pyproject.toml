[build-system]
requires = ["setuptools>=60"]
build-backend = "setuptools.build_meta"

[project]
name = "AI-bench"
dynamic = ["version"]
requires-python = ">=3.10,<3.15"
description = "AI kernel benchmarking harness"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Adam Siemieniuk", email = "adam.siemieniuk@intel.com"},
    {name = "Marcin Spoczynski", email = "marcin@spoczynski.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Benchmark",
]
keywords = [
  "benchmark", "pytorch", "triton", "helion",
  "gpu", "xpu", "kernel", "performance"
]
dependencies = [
  "PyYAML",
  "numpy",
  "python-dotenv",
  "einops",
  "argcomplete",
  "natsort",
  "StrEnum; python_version < '3.11'",
]

[project.scripts]
ai-bench = "ai_bench.cli:main"
ai-bench-compare = "ai_bench.cli_compare:main"

[project.urls]
Homepage = "https://github.com/libxsmm/AI-bench"
Repository = "https://github.com/libxsmm/AI-bench"

[project.optional-dependencies]
cpu = [
  "torch==2.13.0+cpu",
]
xpu = [
  "torch==2.13.0+xpu",
  "helion==1.4.0",
]
cuda = [
  "torch==2.13.0+cu130",
  "torchvision==0.28.0",
  "helion==1.4.0",
]
#mlir = [
#  "lighthouse[ingress_torch_mlir]",
#  "ml-dtypes",
#]
# If triton-cpu build fails with a stale LLVM path, clear caches:
#   rm -r ~/.triton/llvm
#   rm -r ~/.cache/uv/git-v0/checkouts/*/[triton rev hash]/build
triton-cpu = [
  "triton",
  "triton-cpu-utils", # Local kernel helper package (see: backends/utils).
  # Extra build dependencies from triton-cpu requirements.txt.
  "setuptools>=40.8.0",
  "wheel",
  "cmake>=3.20,<4.0",
  "ninja>=1.11.1",
  "nanobind==2.10.2",
  "pybind11>=2.13.1",
  "lit",
]
cutile-cpu = [
  "torch==2.13.0+cpu",
  "cuda-tile",
  "numpy",
  "triton",
  "cutile-cpu-utils", # Local kernel helper package (see: backends/utils).
  # Build dependencies for cuda-tile and triton, which use the project environment.
  "setuptools==80.10.2",
  "wheel",
  "cmake>=3.24,<4.0",
  "ninja>=1.11.1",
  "nanobind>=2.9,<3",
  "pybind11>=2.13.1",
  "lit",
]

[dependency-groups]
dev = [
  "ruff==0.14.10",
  "pre-commit",
  "pytest",
  "pytest-timeout",
  "mypy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
timeout = 60
filterwarnings = [
    'error', # Turn all uncaptured warnings into errors.
    'ignore::DeprecationWarning',
    'ignore::FutureWarning',
    'ignore::UserWarning',
]

[tool.uv]
index-strategy = "unsafe-best-match"
no-build-isolation-package = ["cuda-tile", "triton"]
conflicts = [
  # Restrict to one device to avoid incompatible dependencies.
  [
    { extra = "cpu" },
    { extra = "xpu" },
    { extra = "cuda" },
  ],
  # Set as conflict to ensure correct Triton dependency is chosen between devices.
  [
    { extra = "xpu" },
    { extra = "cuda" },
    { extra = "triton-cpu" },
  ],
  # CuTile CPU is compatible with Triton CPU, but not GPU device extras.
  [
    { extra = "xpu" },
    { extra = "cuda" },
    { extra = "cutile-cpu" },
  ],
]

[tool.uv.extra-build-variables.cuda-tile]
CUTILE_BUILD_VARIANT = "cpu"

[tool.uv.extra-build-variables.triton]
TRITON_APPEND_CMAKE_ARGS = "-DTRITON_CODEGEN_BACKENDS=cpu"
TRITON_BUILD_WITH_CLANG_LLD = "1"
LLVM_TARGETS = "Native"
LLVM_PROJECTS = "mlir;llvm"
LLVM_DISTRIBUTION_COMPONENTS = "llvm-headers;llvm-libraries;cmake-exports;mlir-headers;mlir-libraries;mlir-cmake-exports;llc;opt;llvm-config;mlir-tblgen;mlir-translate"

[tool.uv.sources]
torch = { index = "pytorch" }
triton = { git = "https://github.com/intel-sandbox/users.fschlimb.triton-cpu", rev = "d4e39fae7975abf1533db351273b2c2ba0e7ed70" }
cuda-tile = { git = "https://github.com/fschlimb/cutile-python", branch = "bench" }
lighthouse = { git = "https://github.com/llvm/lighthouse", rev = "bc1da11" }
mlir-python-bindings = { index = "eudsl" }
triton-cpu-utils = { path = "backends/utils/triton_cpu_utils", editable = true }
cutile-cpu-utils = { path = "backends/utils/cutile_cpu_utils", editable = true }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl"

[[tool.uv.index]]
name = "eudsl"
url = "https://llvm.github.io/eudsl"
explicit = true
format = "flat"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_bench*"]

[tool.setuptools.package-data]
ai_bench = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "ai_bench.__version__"}

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "torch.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "triton.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "helion.*"
ignore_missing_imports = true

[tool.ruff]
src = ["AI-bench"]
target-version = "py310"
line-length = 88

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.ruff.lint]
preview = true
select = [
  "A", # builtin shadowing
  "D419", # empty-docstring
  "E", # Error
  "F", # Pyflakes
  "I", # isort
  "N801", # invalid-class-name
  "N804", # cls for class methods
  "N805", # self for methods
  "N818", # error-suffix-on-exception-name
  "N999", # invalid-module-name
  "PERF", # Perflint
  "RUF022", # __all__ is not sorted
  "RUF030", # print() call in assert
  "RUF034", # useless if-else
  "RUF047", # empty else
  "RUF200", # invalid pyproject.toml
  "W", # Warning
]
ignore = [
    "E501", # line-too-long
    "PERF203", # try-except-in-loop
    "PERF401", # manual-list-comprehension
]

[tool.ruff.lint.isort]
known-local-folder = ["ai_bench"]
known-first-party = ["triton_cpu_utils"]
known-third-party = [
  "torch", "triton", "helion",
  "mlir", "lighthouse", "torch_mlir",
]
force-single-line = true  # Improves merge conflicts
force-sort-within-sections = true
