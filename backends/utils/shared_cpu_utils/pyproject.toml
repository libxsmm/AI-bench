[build-system]
requires = ["setuptools>=60"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-cpu-utils"
version = "0.1.0"
description = "Helper utilities shared by AI-bench CPU backends"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["shared_cpu_utils"]

[tool.setuptools.package-dir]
shared_cpu_utils = "."
