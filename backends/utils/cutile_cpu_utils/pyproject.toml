[build-system]
requires = ["setuptools>=60"]
build-backend = "setuptools.build_meta"

[project]
name = "cutile-cpu-utils"
version = "0.1.0"
description = "Helper utilities for AI-bench CuTile CPU kernels"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["cutile_cpu_utils"]

[tool.setuptools.package-dir]
cutile_cpu_utils = "."